name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The gradle-wrapper.jar binary isn't committed to this repo (see README).
      # setup-gradle provisions a matching Gradle install directly, so ./gradlew
      # isn't needed here — this also generates the wrapper jar as a side effect
      # for anyone who pulls the build cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rvh-grader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
